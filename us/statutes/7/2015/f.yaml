- name: person_is_snap_compact_of_free_association_resident
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 U.S.C. 2015(f)(2)(D)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
