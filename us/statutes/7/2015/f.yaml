      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/statute/7/2015/f
  versions:
  - effective_from: '2025-07-04'
    formula: person_is_resident_of_united_states
- name: person_is_snap_citizen_or_national
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
