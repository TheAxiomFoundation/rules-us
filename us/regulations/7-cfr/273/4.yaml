- name: sponsored_alien
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(c), 7 CFR 273.4(c)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: (c) Households containing sponsored alien members—(1) Definition.
            A sponsored alien is an alien for whom a person (the sponsor) has executed
            an affidavit of support (USCIS Form I-864 or I-864A) on behalf of the
            alien pursuant to section 213A of the INA.
  versions:
  - effective_from: '2025-10-01'
    formula: 'member_is_alien

      and sponsor_executed_form_i_864_or_i_864a_on_behalf_of_member'
- name: qualifying_quarter_requirement_satisfied
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)(6)(ii)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: 'based on the sum of: quarters the alien worked; quarters credited
            from the work of a parent'
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#qualifying_quarters_required
          output: qualifying_quarters_required
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#spouse_qualifying_quarter_credit_available
          output: spouse_qualifying_quarter_credit_available
          hash: sha256:local
  versions:
  - effective_from: '2025-10-01'
    formula: "qualifying_quarters_from_alien_or_parent >= qualifying_quarters_required\n\
      or (\n  spouse_qualifying_quarter_credit_available\n  and (\n    qualifying_quarters_from_alien_or_parent\n\
      \    + qualifying_quarters_from_spouse\n    >= qualifying_quarters_required\n\
      \  )\n)"
