format: rulespec/v1
rules:
- name: spouse_qualifying_quarter_credit_available
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)(6)(ii)(A)-(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: during their marriage if they are still married or the spouse is
            deceased
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A spouse may not get credit for quarters of a spouse when the couple
            divorces prior to a determination of SNAP eligibility.
  versions:
  - effective_from: '2025-10-01'
    formula: "spouse_quarters_credited_from_work_during_marriage\nand (\n  alien_and_spouse_are_still_married\n\
      \  or spouse_is_deceased\n)\nand not couple_divorced_before_snap_eligibility_determination"
- name: snap_member_citizenship_or_alien_status_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  visibility: public
  source: 7 CFR 273.4(a), 7 CFR 273.4(a)(6)(ii)(A)-(J), 7 CFR 273.4(b)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: No person is eligible to participate in the Program unless that
            person is
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: quarters the alien worked; quarters credited from the work of a
            parent
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: eligibility continues until the next recertification
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: must classify that person as an ineligible alien
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2015/f#person_has_qualifying_snap_alien_or_citizenship_status
          output: person_has_qualifying_snap_alien_or_citizenship_status
          hash: sha256:28557414273a1558cf68b8afbe2e15456704c1b88f20daa10d42aeb3928eb13a
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/usda/fns/snap-obbb-alien-eligibility-implementation-memo#person_is_in_obbb_permitted_alien_group
          output: person_is_in_obbb_permitted_alien_group
          hash: sha256:2da41636440b0312ee239dc14ecd4088cc27b546b4a4f136c8447f92eedb81a0
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#qualifying_quarters_required
          output: qualifying_quarters_required
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#spouse_qualifying_quarter_credit_available
          output: spouse_qualifying_quarter_credit_available
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#spouse_quarter_eligibility_continues_until_recertification
          output: spouse_quarter_eligibility_continues_until_recertification
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#lpr_nonquarter_wait_exception_applies
          output: lpr_nonquarter_wait_exception_applies
          hash: sha256:local
  versions:
  - effective_from: '2025-10-01'
    formula: "member_is_us_citizen\nor member_is_us_noncitizen_national\nor (\n  not\
      \ alien_status_documentation_missing_or_unwilling\n  and person_has_qualifying_snap_alien_or_citizenship_status\n\
      \  and (\n    member_is_lawful_permanent_resident\n    or member_is_cuban_or_haitian_entrant\n\
      \    or person_is_in_obbb_permitted_alien_group\n  )\n  and (\n    not member_is_lawful_permanent_resident\n\
      \    or qualified_alien_five_year_status_period_met\n    or lpr_nonquarter_wait_exception_applies\n\
      \    or qualifying_quarters_from_alien_or_parent >= qualifying_quarters_required\n\
      \    or (\n      spouse_qualifying_quarter_credit_available\n      and (\n \
      \       qualifying_quarters_from_alien_or_parent\n        + qualifying_quarters_from_spouse\n\
      \        >= qualifying_quarters_required\n      )\n    )\n    or spouse_quarter_eligibility_continues_until_recertification\n\
      \  )\n)"
- name: qualifying_quarters_required
  kind: parameter
  dtype: Count
  source: 7 CFR 273.4(a)(6)(ii)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: has 40 qualifying quarters
  versions:
  - effective_from: '2025-10-01'
    formula: '40'
- name: spouse_quarter_eligibility_continues_until_recertification
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)(6)(ii)(A)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: eligibility continues until the next recertification
  versions:
  - effective_from: '2025-10-01'
    formula: 'spouse_quarter_credit_used_for_snap_eligibility

      and spouse_quarter_couple_divorced_after_eligibility_determination

      and current_period_before_next_recertification'
- name: lpr_nonquarter_wait_exception_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)(3)-(4), 7 CFR 273.4(a)(6)(ii)(F)-(J)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: is not subject to the requirement to be in qualified status for
            5 years
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: An individual who is under 18 years of age
  versions:
  - effective_from: '2025-10-01'
    formula: 'member_is_under_age_eighteen

      or member_receives_blindness_or_disability_benefits

      or member_was_lawfully_residing_on_prwora_enactment_date_and_is_older_person

      or member_has_eligible_military_connection

      or member_is_amerasian_immigrant

      or member_is_american_indian_born_abroad

      or member_is_hmong_or_highland_laotian_qualifying_person_or_family_member'
